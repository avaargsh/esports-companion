name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: esports
          POSTGRES_PASSWORD: esports
          POSTGRES_DB: esports_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esports -d esports_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://esports:esports@localhost:5432/esports_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: python -m app.seed
      - run: ruff check app tests
      - run: pytest -q

  miniapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run type-check
      - run: npm run build:mp-weixin

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build


  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production API image
        run: docker build --build-arg INSTALL_DEV=false -t esports-companion-api:ci services/api
      - name: Verify non-root runtime
        run: |
          test "$(docker image inspect esports-companion-api:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Verify application imports
        run: docker run --rm -e APP_ENV=test esports-companion-api:ci python -c "import app.main"


  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: esports
          POSTGRES_PASSWORD: esports
          POSTGRES_DB: esports_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esports -d esports_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://esports:esports@localhost:5432/esports_smoke
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: services/api
        run: pip install -e .
      - name: Migrate and seed demo
        working-directory: services/api
        run: |
          alembic upgrade head
          python -m app.seed
      - name: Start API
        working-directory: services/api
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/esports-api.log 2>&1 &
          echo $! > /tmp/esports-api.pid
      - name: Run HTTP Golden Slice
        run: python3 scripts/smoke_demo.py
      - name: Show API logs on failure
        if: failure()
        run: cat /tmp/esports-api.log


  backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: esports
          POSTGRES_PASSWORD: esports
          POSTGRES_DB: esports_backup_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esports -d esports_backup_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      SOURCE_DATABASE_URL: postgresql+psycopg://esports:esports@localhost:5432/esports_backup_source
      RESTORE_DATABASE_URL: postgresql+psycopg://esports:esports@localhost:5432/esports_backup_restore
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      PGPASSWORD: esports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client and API
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pip install -e services/api
      - name: Prepare source database
        working-directory: services/api
        env:
          DATABASE_URL: ${{ env.SOURCE_DATABASE_URL }}
        run: |
          alembic upgrade head
          python -m app.seed
      - name: Backup source database
        env:
          DATABASE_URL: ${{ env.SOURCE_DATABASE_URL }}
        run: ./scripts/db_backup.sh /tmp/esports.dump
      - name: Create restore target
        run: createdb -h localhost -U esports esports_backup_restore
      - name: Restore backup
        env:
          TARGET_DATABASE_URL: ${{ env.RESTORE_DATABASE_URL }}
          RESTORE_CONFIRM: RESTORE_TO_TARGET
        run: ./scripts/db_restore.sh /tmp/esports.dump
      - name: Verify restored schema and seed data
        env:
          DATABASE_URL: ${{ env.RESTORE_DATABASE_URL }}
        run: python scripts/db_verify.py
      - name: Start API on restored database
        working-directory: services/api
        env:
          DATABASE_URL: ${{ env.RESTORE_DATABASE_URL }}
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/restore-api.log 2>&1 &
          echo $! > /tmp/restore-api.pid
      - name: Run Golden Slice against restored database
        run: python3 scripts/smoke_demo.py
      - name: Show restored API logs on failure
        if: failure()
        run: cat /tmp/restore-api.log || true
