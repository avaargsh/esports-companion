name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: esports
          POSTGRES_PASSWORD: esports
          POSTGRES_DB: esports_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esports -d esports_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://esports:esports@localhost:5432/esports_test
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: ruff check app tests
      - run: pytest -q
