name: API Go

on:
  push:
    branches:
      - main
      - "refactor/**"
    paths:
      - "services/api-go/**"
      - ".github/workflows/api-go.yml"
  pull_request:
    paths:
      - "services/api-go/**"
      - ".github/workflows/api-go.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-go

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: services/api-go/go.mod

      - name: Download modules
        run: go mod download

      - name: Format check
        run: |
          diff="$(gofmt -d .)"
          if [ -n "$diff" ]; then
            echo "$diff"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/api
