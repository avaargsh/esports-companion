name: API Go

on:
  push:
    branches:
      - "refactor/**"
    paths:
      - "services/api-go/**"
      - "scripts/go_read_parity.py"
      - "scripts/go_auth_parity.py"
      - "scripts/go_offering_parity.py"
      - "scripts/go_order_read_parity.py"
      - "scripts/go_order_create_parity.py"
      - "scripts/go_claim_parity.py"
      - "scripts/go_lifecycle_parity.py"
      - "scripts/go_settlement_parity.py"
      - "scripts/go_mock_payment_parity.py"
      - "scripts/go_payment_prepare_parity.py"
      - "scripts/generate_wechat_callback_fixture.py"
      - "scripts/go_payment_callback_parity.py"
      - "scripts/go_refund_submit_parity.py"
      - "docs/go-backend-migration.md"
      - ".github/workflows/api-go.yml"
  pull_request:
    paths:
      - "services/api-go/**"
      - "scripts/go_read_parity.py"
      - "scripts/go_auth_parity.py"
      - "scripts/go_offering_parity.py"
      - "scripts/go_order_read_parity.py"
      - "scripts/go_order_create_parity.py"
      - "scripts/go_claim_parity.py"
      - "scripts/go_lifecycle_parity.py"
      - "scripts/go_settlement_parity.py"
      - "scripts/go_mock_payment_parity.py"
      - "scripts/go_payment_prepare_parity.py"
      - "scripts/generate_wechat_callback_fixture.py"
      - "scripts/go_payment_callback_parity.py"
      - "scripts/go_refund_submit_parity.py"
      - "docs/go-backend-migration.md"
      - ".github/workflows/api-go.yml"

concurrency:
  group: api-go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-go

    steps:
      - uses: actions/checkout@v4

      - name: Enforce Go integration target
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feat/go-') || startsWith(github.head_ref, 'fix/go-')) }}
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" != "refactor/go-backend-foundation" ]; then
            echo "Go child branches must target refactor/go-backend-foundation"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: services/api-go/go.sum

      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Format check
        run: |
          gofmt -w .
          git diff --exit-code -- .

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/api

  parity:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: esports
          POSTGRES_PASSWORD: esports
          POSTGRES_DB: esports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esports -d esports"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://esports:esports@127.0.0.1:5432/esports
      REDIS_URL: redis://127.0.0.1:6379/0
      AUTH_PROVIDER: mock
      PAYMENT_PROVIDER: mock
      REFUND_PROVIDER: manual
      SESSION_SIGNING_KEY: dev-only-change-me-use-at-least-32-bytes
      API_GO_HTTP_ADDR: 127.0.0.1:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: services/api-go/go.sum

      - name: Install FastAPI reference
        run: python -m pip install -e "./services/api[dev]"

      - name: Generate WeChat callback parity fixture
        run: python3 scripts/generate_wechat_callback_fixture.py --github-env "$GITHUB_ENV"

      - name: Download Go modules
        working-directory: services/api-go
        run: go mod download

      - name: Migrate and seed shared database
        working-directory: services/api
        run: |
          alembic upgrade head
          python -m app.seed

      - name: Build Go target
        working-directory: services/api-go
        run: go build -o /tmp/esports-api-go ./cmd/api

      - name: Start FastAPI reference
        run: |
          cd services/api
          uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/fastapi.log 2>&1 &
          echo $! >/tmp/fastapi.pid

      - name: Start Go target
        run: |
          /tmp/esports-api-go >/tmp/api-go.log 2>&1 &
          echo $! >/tmp/api-go.pid

      - name: Wait for both runtimes
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null && curl -fsS http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "runtimes did not become ready"
          exit 1

      - name: Compare M1 read contracts
        run: python3 scripts/go_read_parity.py

      - name: Compare M2 auth session contracts
        run: python3 scripts/go_auth_parity.py

      - name: Compare M2.1 provider offering contracts
        run: python3 scripts/go_offering_parity.py

      - name: Compare M3 order read contracts
        run: python3 scripts/go_order_read_parity.py

      - name: Compare M3.1 order create contracts
        run: python3 scripts/go_order_create_parity.py

      - name: Compare M3.2 atomic claim contracts
        run: python3 scripts/go_claim_parity.py

      - name: Compare M3.3 provider lifecycle contracts
        run: python3 scripts/go_lifecycle_parity.py

      - name: Compare M3.4 customer settlement contracts
        run: python3 scripts/go_settlement_parity.py

      - name: Compare M3.5 mock payment contracts
        run: python3 scripts/go_mock_payment_parity.py

      - name: Compare M4.1 payment prepare contracts
        run: python3 scripts/go_payment_prepare_parity.py

      - name: Compare M4.2 signed payment callback contracts
        run: python3 scripts/go_payment_callback_parity.py

      - name: Dump runtime logs on failure
        if: failure()
        run: |
          echo "=== FastAPI ==="
          cat /tmp/fastapi.log || true
          echo "=== Go API ==="
          cat /tmp/api-go.log || true

      - name: Stop runtimes
        if: always()
        run: |
          test ! -f /tmp/fastapi.pid || kill "$(cat /tmp/fastapi.pid)" || true
          test ! -f /tmp/api-go.pid || kill "$(cat /tmp/api-go.pid)" || true
