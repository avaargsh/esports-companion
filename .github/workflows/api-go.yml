name: API Go

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "feat/go-*"
      - "fix/go-*"
    paths:
      - "services/api-go/**"
      - "scripts/go_read_parity.py"
      - "docs/go-backend-migration.md"
      - ".github/workflows/api-go.yml"
  pull_request:
    paths:
      - "services/api-go/**"
      - "scripts/go_read_parity.py"
      - "docs/go-backend-migration.md"
      - ".github/workflows/api-go.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: services/api-go/go.mod
      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format check
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/api

  parity:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: esports
          POSTGRES_PASSWORD: esports
          POSTGRES_DB: esports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esports -d esports"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://esports:esports@127.0.0.1:5432/esports
      REDIS_URL: redis://127.0.0.1:6379/0
      AUTH_PROVIDER: mock
      PAYMENT_PROVIDER: mock
      REFUND_PROVIDER: manual
      SESSION_SIGNING_KEY: dev-only-change-me-use-at-least-32-bytes
      API_GO_HTTP_ADDR: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: services/api-go/go.mod
      - name: Install FastAPI reference
        run: python -m pip install -e "./services/api[dev]"
      - name: Download Go modules
        working-directory: services/api-go
        run: go mod download
      - name: Migrate and seed shared database
        working-directory: services/api
        run: |
          alembic upgrade head
          python -m app.seed
      - name: Start FastAPI reference
        run: |
          cd services/api
          uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/fastapi.log 2>&1 &
      - name: Start Go target
        run: |
          cd services/api-go
          go run ./cmd/api >/tmp/api-go.log 2>&1 &
      - name: Wait for both runtimes
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null && curl -fsS http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Compare M1 read contracts
        run: python3 scripts/go_read_parity.py
      - name: Dump runtime logs on failure
        if: failure()
        run: |
          echo "=== FastAPI ==="
          cat /tmp/fastapi.log || true
          echo "=== Go API ==="
          cat /tmp/api-go.log || true
