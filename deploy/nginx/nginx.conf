worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $http_x_request_id $upstream_request_id {
        default $http_x_request_id;
        "" $request_id;
    }

    limit_req_status 429;
    limit_conn_status 429;

    limit_req_zone $binary_remote_addr zone=general_per_ip:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=admin_per_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=provider_callback_per_ip:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 1m;
        client_body_timeout 10s;
        send_timeout 30s;

        location = /livez {
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params_esports;
        }

        location = /readyz {
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params_esports;
        }

        location = /health {
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params_esports;
        }

        location = /api/v1/payments/wechat/callback {
            limit_req zone=provider_callback_per_ip burst=100 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params_esports;
        }

        location = /api/v1/refunds/wechat/callback {
            limit_req zone=provider_callback_per_ip burst=100 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params_esports;
        }

        location ^~ /api/v1/auth/ {
            limit_req zone=auth_per_ip burst=10 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params_esports;
        }

        location ^~ /api/v1/admin/ {
            limit_req zone=admin_per_ip burst=20 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params_esports;
        }

        location = /ws {
            limit_conn conn_per_ip 5;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_send_timeout 30s;
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params_esports;
        }

        location / {
            limit_req zone=general_per_ip burst=60 nodelay;
            limit_conn conn_per_ip 20;
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params_esports;
        }
    }
}
