name: ${COMPOSE_PROJECT_NAME:-esports-companion-production}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: esports
      POSTGRES_DB: esports
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esports -d esports"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command:
      - sh
      - -ec
      - |
        export MINIO_ROOT_USER="$(cat /run/secrets/minio_access_key)"
        export MINIO_ROOT_PASSWORD="$(cat /run/secrets/minio_secret_key)"
        exec minio server /data --console-address ":9001"
    secrets:
      - minio_access_key
      - minio_secret_key
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - minio_data:/data
    security_opt:
      - no-new-privileges:true

  ingress:
    image: nginx:1.27-alpine
    ports:
      - "${INGRESS_BIND_ADDRESS:-127.0.0.1}:${INGRESS_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/proxy_params_esports:/etc/nginx/proxy_params_esports:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/readyz
      interval: 10s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ../../services/api
      args:
        INSTALL_DEV: "false"
    env_file:
      - ${RUNTIME_ENV_FILE:-../../.env.production}
    environment:
      APP_ENV: ${APP_ENV:-production}
      SESSION_SIGNING_KEY_FILE: /run/secrets/session_signing_key
      WECHAT_APP_SECRET_FILE: /run/secrets/wechat_app_secret
      WECHAT_MCH_PRIVATE_KEY_FILE: /run/secrets/wechat_mch_private_key
      WECHAT_PAY_API_V3_KEY_FILE: /run/secrets/wechat_pay_api_v3_key
      WECHAT_PAY_PLATFORM_CERTIFICATE_FILE: /run/secrets/wechat_platform_certificate
      REDIS_URL: redis://redis:6379/0
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
    secrets:
      - postgres_password
      - session_signing_key
      - wechat_app_secret
      - wechat_mch_private_key
      - wechat_pay_api_v3_key
      - wechat_platform_certificate
      - minio_access_key
      - minio_secret_key
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        export DATABASE_URL="postgresql+psycopg://esports:$$(cat /run/secrets/postgres_password)@postgres:5432/esports"
        alembic upgrade head
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers "${UVICORN_WORKERS:-1}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s

secrets:
  postgres_password:
    file: ${RUNTIME_SECRETS_DIR:-../secrets}/postgres_password
  session_signing_key:
    file: ${RUNTIME_SECRETS_DIR:-../secrets}/session_signing_key
  wechat_app_secret:
    file: ${RUNTIME_SECRETS_DIR:-../secrets}/wechat_app_secret
  wechat_mch_private_key:
    file: ${RUNTIME_SECRETS_DIR:-../secrets}/wechat_mch_private_key
  wechat_pay_api_v3_key:
    file: ${RUNTIME_SECRETS_DIR:-../secrets}/wechat_pay_api_v3_key
  wechat_platform_certificate:
    file: ${RUNTIME_SECRETS_DIR:-../secrets}/wechat_platform_certificate
  minio_access_key:
    file: ${RUNTIME_SECRETS_DIR:-../secrets}/minio_access_key
  minio_secret_key:
    file: ${RUNTIME_SECRETS_DIR:-../secrets}/minio_secret_key

volumes:
  postgres_data:
  redis_data:
  minio_data:
