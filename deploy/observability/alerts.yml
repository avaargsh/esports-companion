groups:
  - name: esports-companion-api
    interval: 30s
    rules:
      - alert: EsportsCompanionApiDown
        expr: up{job="esports-companion-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: esports-companion API scrape target is down
          runbook: docs/alert-runbook.md#api-down

      - alert: EsportsCompanionHigh5xxRatio
        expr: |
          (
            sum(rate(esports_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(esports_http_requests_total[5m])), 0.001)
          ) > 0.05
          and
          sum(rate(esports_http_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: API 5xx ratio is above 5%
          runbook: docs/alert-runbook.md#high-5xx-ratio

      - alert: EsportsCompanionHighP99Latency
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (
              rate(esports_http_request_duration_seconds_bucket[5m])
            )
          ) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API p99 latency is above 1.5 seconds
          runbook: docs/alert-runbook.md#high-p99-latency

      - alert: EsportsCompanionOperationalMetricsScanFailed
        expr: esports_operational_metrics_scan_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL operational metrics scan is failing
          runbook: docs/alert-runbook.md#operational-metrics-scan-failed

      - alert: EsportsCompanionWorkerMetricsStale
        expr: |
          time() - esports_worker_last_success_unixtime{worker="operational-metrics"} > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Go worker operational metrics scan has not completed successfully
          runbook: docs/alert-runbook.md#background-worker-stalled

      - alert: EsportsCompanionOutboxWorkerStale
        expr: |
          time() - esports_worker_last_success_unixtime{worker="outbox"} > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Go transactional outbox worker has not completed a successful cycle
          runbook: docs/alert-runbook.md#background-worker-stalled

      - alert: EsportsCompanionAssignmentStartOverdue
        expr: esports_assignments_start_overdue > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: accepted orders exceeded the configured provider start timeout
          runbook: docs/alert-runbook.md#background-worker-stalled

      - alert: EsportsCompanionOutboxStuck
        expr: |
          esports_outbox_pending > 0
          and esports_outbox_oldest_pending_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: transactional outbox has pending events older than 60 seconds
          runbook: docs/alert-runbook.md#outbox-stuck

      - alert: EsportsCompanionRefundStuck
        expr: |
          esports_refunds_inflight > 0
          and esports_refunds_oldest_inflight_seconds > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: refund has remained in-flight for more than 15 minutes
          runbook: docs/alert-runbook.md#refund-stuck

      - alert: EsportsCompanionWithdrawalStuck
        expr: |
          esports_withdrawals_pending > 0
          and esports_withdrawals_oldest_pending_seconds > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: withdrawal has remained pending for more than one hour
          runbook: docs/alert-runbook.md#withdrawal-stuck

      - alert: EsportsCompanionDisputeAging
        expr: |
          esports_disputes_open > 0
          and esports_disputes_oldest_open_seconds > 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: dispute has remained unresolved for more than 24 hours
          runbook: docs/alert-runbook.md#dispute-aging


      - alert: EsportsCompanionFinishRequestOverdue
        expr: esports_finish_requests_overdue > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: finish request remained pending beyond the configured auto-confirm timeout
          runbook: docs/alert-runbook.md#finish-request-overdue
